<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Awatar użytkownika "psp" w Home Assistant: PSP z panelem kafelków. Kolory Gruvbox. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#32302f"/>
      <stop offset="1" stop-color="#1d2021"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- obudowa PSP -->
  <rect x="36" y="168" width="440" height="176" rx="88" fill="#504945"/>
  <rect x="36" y="168" width="440" height="176" rx="88" fill="none" stroke="#665c54" stroke-width="4"/>

  <!-- ekran -->
  <rect x="146" y="188" width="220" height="136" rx="8" fill="#1d2021"/>
  <!-- kafelki panelu HA: 3 x 2 -->
  <g>
    <rect x="156" y="198" width="62" height="54" rx="6" fill="#b8bb26"/>
    <rect x="225" y="198" width="62" height="54" rx="6" fill="#83a598"/>
    <rect x="294" y="198" width="62" height="54" rx="6" fill="#fabd2f"/>
    <rect x="156" y="260" width="62" height="54" rx="6" fill="#8ec07c"/>
    <rect x="225" y="260" width="62" height="54" rx="6" fill="#fb4934"/>
    <rect x="294" y="260" width="62" height="54" rx="6" fill="#d3869b"/>
  </g>
  <!-- domek na środkowym górnym kafelku -->
  <path d="M256 210l-18 15h5v17h26v-17h5z" fill="#1d2021"/>

  <!-- D-pad -->
  <g fill="#ebdbb2">
    <rect x="80" y="244" width="40" height="24" rx="4"/>
    <rect x="88" y="236" width="24" height="40" rx="4"/>
  </g>
  <!-- przyciski: trójkąt, kółko, krzyżyk, kwadrat -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 222l9 15h-18z" stroke="#8ec07c"/>
    <circle cx="444" cy="256" r="9" stroke="#fb4934"/>
    <path d="M414 284l12 12M426 284l-12 12" stroke="#83a598"/>
    <rect x="387" y="247" width="17" height="17" rx="2" stroke="#d3869b"/>
  </g>
</svg>
