# psp-homelab: Home Assistant panel configuration
# Copy as config.ini into the same directory as EBOOT.PBP
# (on the PSP: ms0:/PSP/GAME/psp-homelab/config.ini).
# Polish version: config.example.pl.ini

# Interface language: en (default) or pl
lang = en

# Home Assistant address (the name must match the certificate)
host = ha.example.dev
port = 443

# Long-lived access token: HA > your profile > Security > Long-lived access tokens.
# Ideally for a separate user without admin rights.
token = PASTE_TOKEN_HERE

# Trusted CAs:
#   empty        = built-in public CAs (e.g. Let's Encrypt)
#   ca.pem       = file with your own CA, next to config.ini
ca =

# Refresh interval in seconds (minimum 5)
refresh = 30

# Number of the saved Wi-Fi network on the PSP (Network Settings), usually 1
wifi_profile = 1

# Entities to display (max. 24 in total). entity lines are shown first,
# in this order.
entity = sensor.living_room_temperature

# Entity list straight from Home Assistant, without editing this file (every 10 min):
#   label:psp   = entities with the "psp" label (Settings > Labels); needs an
#                 admin token, because it uses /api/template
#   light.psp   = members of a group (Helpers > Group; one group = one entity
#                 type, so e.g. light.psp, sensor.psp, binary_sensor.psp
#                 on separate lines); works with any token
# Several lines are allowed; duplicates are skipped.
entities_from = label:psp
#entities_from = light.psp

# Night mode: the screen is dimmed during these hours.
# The first button press only brightens the screen for night_wake seconds.
# night = off disables night mode.
night = 22:00-07:00
night_brightness = 10
night_wake = 30
