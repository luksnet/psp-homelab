# psp-homelab: konfiguracja panelu Home Assistant
# Skopiuj jako config.ini do tego samego katalogu co EBOOT.PBP
# (na PSP: ms0:/PSP/GAME/psp-homelab/config.ini).

# Adres Home Assistant (nazwa musi pasować do certyfikatu)
host = ha.example.dev
port = 443

# Długoterminowy token: HA > Twój profil > Bezpieczeństwo > Tokeny długoterminowe.
# Najlepiej dla osobnego użytkownika bez uprawnień administratora.
token = WKLEJ_TUTAJ_TOKEN

# Zaufane CA:
#   puste        = wbudowane publiczne CA (np. Let's Encrypt)
#   ca.pem       = plik z Twoim własnym CA, obok config.ini
ca =

# Co ile sekund odświeżać (minimum 5)
refresh = 30

# Numer zapisanej sieci Wi-Fi na PSP (Ustawienia sieci), zwykle 1
wifi_profile = 1

# Encje do wyświetlenia (razem maks. 24). Linie entity są pokazywane pierwsze,
# w tej kolejności.
entity = sensor.temperatura_salon

# Lista encji prosto z Home Assistant, bez edytowania tego pliku (co 10 min):
#   label:psp   = encje z etykietą "psp" (Ustawienia > Etykiety); wymaga tokenu
#                 administratora, bo korzysta z /api/template
#   light.psp   = członkowie grupy (Pomocnicy > Grupa; jedna grupa = jeden typ
#                 encji, więc np. light.psp, sensor.psp, binary_sensor.psp
#                 w osobnych liniach); działa z każdym tokenem
# Można podać kilka linii; powtórzenia są pomijane.
entities_from = label:psp
#entities_from = light.psp

# Tryb nocny: w tych godzinach ekran jest przyciemniony.
# Pierwsze naciśnięcie przycisku tylko rozjaśnia ekran na night_wake sekund.
# night = off wyłącza tryb nocny.
night = 22:00-07:00
night_brightness = 10
night_wake = 30
